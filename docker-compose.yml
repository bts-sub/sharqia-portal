# docker-compose لبوابة الموظفين — تعمل على البورت 4000 بجانب تطبيقك الآخر (3001)
services:
  portal:
    build: .
    container_name: sharqia-portal
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4000:4000"   # يُنشَر خلف Nginx فقط (لا يُعرَض مباشرة للإنترنت)
    volumes:
      - ./data:/app/data        # حفظ المستخدمين والطلبات والإشعارات بشكل دائم
      - ./public:/app/public    # ملف الواجهة index.html
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # السيرفر 512MB ويستضيف تطبيقًا آخر: بلا سقف قد تلتهم البوابة الذاكرة
    # فيقتل نظام التشغيل الجارَ بدل المتسبّب.
    mem_limit: 320m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
    init: true            # معالج إشارات صحيح — إيقاف نظيف بدل قتل قسري بعد 10 ثوانٍ
    logging:              # بلا سقف تنمو سجلات Docker حتى يمتلئ القرص فيسقط التطبيقان
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # تطبيق المبيعات (Sales/POS) — حاوية nginx ثابتة مستقلّة تمامًا عن البوابة.
  # واجهة React مضمّنة في ملف واحد، بلا باك-إند. خلف Nginx الأمامي على
  # pos.sharqiaa-tech.net. البورت 4100 (البوابة 4000، تطبيقك الآخر 3001).
  sales:
    image: nginx:alpine
    container_name: sharqia-sales
    restart: unless-stopped
    ports:
      - "127.0.0.1:4100:80"   # لا يُعرَض مباشرة للإنترنت
    volumes:
      - ./sales-app/index.html:/usr/share/nginx/html/index.html:ro   # التطبيق الحقيقي (أودو)
      - ./sales-app/demo.html:/usr/share/nginx/html/demo.html:ro      # نسخة العرض على /demo
      - ./sales-app/static:/usr/share/nginx/html/static:ro            # PWA: الأيقونات والشعار والمانيفست وعامل الخدمة
      - ./sales-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx الثابت يستهلك أقل من ذلك فعليًا؛ السقف يحمي جارَيه على سيرفر 512MB
    mem_limit: 64m
    init: true
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # منصّة المساعدين الأذكياء (ai.sharqiaa-tech.net) — وكيل Claude لكل موظف.
  # مستقلّة تمامًا عن البوابة: ملف بيئة خاص، وبيانات مشفّرة لكل مستخدم في ai-agent/data.
  ai:
    build: ./ai-agent
    container_name: sharqia-ai
    restart: unless-stopped
    env_file:
      - path: ./ai-agent/.env
        required: false
    ports:
      - "127.0.0.1:4200:4200"   # خلف Nginx فقط
    volumes:
      - ./ai-agent/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # السيرفر 512MB ويستضيف خدمات أخرى؛ مرفقات PDF الكبيرة تُفكّ في الذاكرة،
    # وكل جلسة واتساب مربوطة تأخذ ~40-70MB (للمدير وقلّة من الموظفين؛ أكثر = سيرفر أكبر)
    mem_limit: 288m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=224"
    init: true
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # بوت تيليجرام (مساعد Claude) — long-polling، لا يعرض أي بورت.
  # يقرأ متغيّراته (TELEGRAM_BOT_TOKEN/ANTHROPIC_API_KEY/...) من نفس .env.
  bot:
    build: ./bot
    container_name: sharqia-bot
    restart: unless-stopped
    # خلف profile: لا يبدأ مع `docker compose up -d` العادي (حماية من crash-loop
    # قبل توفّر التوكن). يُشغَّل صراحةً: docker compose --profile bot up -d --build bot
    profiles: ["bot"]
    env_file: .env
    volumes:
      - ./bot/data:/app/data        # محادثات المستخدمين بشكل دائم
    mem_limit: 160m                 # السيرفر 512MB ويستضيف تطبيقين آخرين
    environment:
      NODE_OPTIONS: "--max-old-space-size=128"
    init: true
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
