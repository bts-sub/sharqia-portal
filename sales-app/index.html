<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مبيعات بيت العباءة الشرقية</title>
<style>
  :root{
    --bg:#FAFAF8; --card:#FFFFFF; --text:#2F2F2F; --sub:#6B7280; --line:#EAEAEA;
    --navy:#3D3115; --gold:#C9A227; --chip:#F5F1E6; --good:#22C55E; --warn:#F59E0B;
    --bad:#EF4444; --blue:#2563EB; --grad:linear-gradient(135deg,#D4B24A 0%,#C9A227 100%);
    --shadow:0 1px 2px rgba(41,37,36,.04),0 4px 14px rgba(41,37,36,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150F;--card:#201E16;--text:#F0EAD8;--sub:#A79F8C;--line:#33301F;
      --navy:#E8D9A8;--gold:#D8B94F;--chip:#28241A;--good:#34D399;--warn:#F0A93B;--bad:#F16A6A;--blue:#9AA6C2;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;
    align-items:center;justify-content:center;font-weight:900;color:#3D3115;font-size:18px}
  header .ttl{font-weight:800;font-size:15px}
  header .sub{font-size:11px;color:var(--sub)}
  .conn{margin-inline-start:auto;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:4px;background:var(--sub)}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)}
  main{flex:1;padding:14px 16px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .btn{border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
  .btn.primary{background:var(--gold);color:#fff}
  .btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:8px 12px;font-size:12px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input,textarea{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text);outline:none;font-size:14px;font-family:inherit}
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
  .lbl{font-size:12px;color:var(--sub);margin-bottom:5px}
  .fld{margin-bottom:12px}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .muted{color:var(--sub);font-size:12px}
  .title{font-weight:800;font-size:16px;margin:4px 0 10px}
  .back{background:transparent;border:none;color:var(--gold);cursor:pointer;font-size:22px;padding:0;line-height:1}
  .list-item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:none}
  .qtybox{display:flex;align-items:center;gap:6px}
  .qtybox button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:18px;cursor:pointer;line-height:1}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);
    border-top:1px solid var(--line);display:flex}
  nav button{flex:1;padding:10px 4px;background:none;border:none;color:var(--sub);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
  nav button.on{color:var(--gold);font-weight:800}
  nav .ic{font-size:18px}
  .empty{text-align:center;color:var(--sub);padding:40px 10px}
  .spin{width:22px;height:22px;border:3px solid rgba(201,162,39,.25);border-top-color:var(--gold);
    border-radius:50%;animation:sp .7s linear infinite;margin:24px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:100;max-width:90%;
    text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:60}
  .sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;
    padding:16px;max-height:85vh;overflow-y:auto}
  .linkbox{background:var(--chip);border:1px dashed var(--gold);border-radius:12px;padding:12px;
    word-break:break-all;font-size:12.5px;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--chip);flex-shrink:0}
  .thumb-ph{display:flex;align-items:center;justify-content:center;font-size:20px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">ع</div>
    <div>
      <div class="ttl">مبيعات بيت العباءة الشرقية</div>
      <div class="sub">موصّل بأودو — أوامر بيع ولينك دفع</div>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">…</span></div>
  </header>
  <main id="main"><div class="spin"></div></main>
  <nav>
    <button data-nav="orders" class="on"><span class="ic">🧾</span>الطلبات</button>
    <button data-nav="new"><span class="ic">➕</span>طلب خارجي</button>
    <button data-nav="products"><span class="ic">🛍️</span>المنتجات</button>
  </nav>
</div>

<script>
(function(){
  "use strict";
  var API = "/api/sales";
  var $ = function(s,el){return (el||document).querySelector(s);};
  var main = document.getElementById("main");

  // ---------- أدوات ----------
  function money(n){ n=Number(n)||0; return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" ر.س"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function toast(msg){ var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(function(){t.remove();},300); },2200); }
  function api(path,opts){
    opts=opts||{};
    var h={}; if(opts.body){ h["Content-Type"]="application/json"; opts.body=JSON.stringify(opts.body); }
    return fetch(API+path,{method:opts.method||"GET",headers:h,body:opts.body}).then(function(r){
      return r.json().catch(function(){return {};}).then(function(d){
        if(!r.ok) throw new Error(d.error||("خطأ "+r.status)); return d; });
    });
  }
  var STATE_AR={draft:["مسودّة","var(--warn)"],sent:["مُرسل للعميل","var(--blue)"],sale:["مؤكّد","var(--good)"],
    done:["منجز","var(--good)"],cancel:["ملغي","var(--bad)"]};
  function stateBadge(s){ var m=STATE_AR[s]||[s,"var(--sub)"]; return '<span class="badge" style="background:'+m[1]+'22;color:'+m[1]+'">'+esc(m[0])+'</span>'; }
  // صورة مصغّرة للمنتج (من بروكسي الخادم) + بديل أنيق عند غياب الصورة
  function thumbHtml(id){ return '<img class="thumb" src="/api/sales/products/'+id+'/image" loading="lazy" data-thumb alt="">'; }
  function wireThumbs(el){ (el||document).querySelectorAll('img[data-thumb]').forEach(function(im){ im.onerror=function(){ this.onerror=null; var b=document.createElement('span'); b.className='thumb thumb-ph'; b.textContent='🛍️'; if(this.parentNode) this.parentNode.replaceChild(b,this); }; }); }

  // ---------- حالة التطبيق ----------
  var view={name:"orders"};
  var cart=[];          // [{product_id,name,code,price,qty}]
  var customer=null;    // {id,name,phone}
  var note="";

  function setNav(n){ var btns=document.querySelectorAll("nav button"); for(var i=0;i<btns.length;i++){ btns[i].classList.toggle("on",btns[i].getAttribute("data-nav")===n); } }

  // ---------- فحص الاتصال ----------
  function checkConn(){
    api("/health").then(function(){ $("#connDot").className="dot ok"; $("#connTxt").textContent="متصل"; })
      .catch(function(){ $("#connDot").className="dot bad"; $("#connTxt").textContent="غير متصل"; });
  }

  // ================= شاشة: الطلبات =================
  function screenOrders(){
    view={name:"orders"}; setNav("orders");
    main.innerHTML='<div class="title">آخر الطلبات</div><div id="ordWrap"><div class="spin"></div></div>';
    api("/orders?limit=25").then(function(rows){
      if(!rows.length){ $("#ordWrap").innerHTML='<div class="empty">لا توجد طلبات بعد.<br>أنشئ طلبًا خارجيًا جديدًا.</div>'; return; }
      var html='<div class="card" style="padding:0">';
      rows.forEach(function(o){
        html+='<div class="list-item" data-open="'+o.id+'">'
          +'<div style="flex:1"><div style="font-weight:800">'+esc(o.name)+'</div>'
          +'<div class="muted">'+esc(o.partner?o.partner.name:"—")+'</div></div>'
          +'<div style="text-align:left">'+stateBadge(o.state)
          +'<div style="font-weight:800;margin-top:4px">'+money(o.amount_total)+'</div></div></div>';
      });
      html+='</div>';
      $("#ordWrap").innerHTML=html;
    }).catch(function(e){ $("#ordWrap").innerHTML='<div class="empty">تعذّر الجلب: '+esc(e.message)+'</div>'; });
  }

  // ================= شاشة: تفاصيل الطلب =================
  function screenOrder(id){
    view={name:"order",id:id};
    main.innerHTML='<button class="back" id="bk">‹</button><div id="odWrap"><div class="spin"></div></div>';
    $("#bk").onclick=screenOrders;
    api("/orders/"+id).then(function(o){
      var lines=o.lines.map(function(l){
        return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)">'
          +'<div><div style="font-weight:700;font-size:13px">'+esc(l.product?l.product.name:l.name)+'</div>'
          +'<div class="muted">'+l.qty+' × '+money(l.price)+'</div></div>'
          +'<div style="font-weight:700">'+money(l.total)+'</div></div>';
      }).join("");
      var canDelete = (o.state==="draft"||o.state==="sent");
      var canConfirm = (o.state==="draft"||o.state==="sent");
      main.innerHTML='<button class="back" id="bk">‹</button>'
        +'<div class="row"><div class="title" style="margin:0">'+esc(o.name)+'</div>'+stateBadge(o.state)+'</div>'
        +'<div class="card"><div class="row"><span class="muted">العميل</span><b>'+esc(o.partner?o.partner.name:"—")+'</b></div></div>'
        +'<div class="card">'+ (lines||'<div class="muted">لا أسطر</div>')
          +'<div class="row" style="margin-top:8px"><span class="muted">قبل الضريبة</span><span>'+money(o.amount_untaxed)+'</span></div>'
          +'<div class="row"><span class="muted">الضريبة</span><span>'+money(o.amount_tax)+'</span></div>'
          +'<div class="row" style="font-weight:900;font-size:16px;margin-top:4px"><span>الإجمالي</span><span>'+money(o.amount_total)+'</span></div></div>'
        +'<button class="btn primary" id="payLink" style="margin-bottom:8px">🔗 توليد لينك الدفع / المعاينة</button>'
        +(canConfirm?'<button class="btn ghost" id="confirm" style="margin-bottom:8px">✓ تأكيد الطلب</button>':'')
        +(canDelete?'<button class="btn ghost" id="del" style="color:var(--bad)">حذف المسودّة</button>':'');
      $("#bk").onclick=screenOrders;
      $("#payLink").onclick=function(){ openPayLink(o); };
      if($("#confirm")) $("#confirm").onclick=function(){
        if(!confirm("تأكيد الطلب "+o.name+"؟ (يتحوّل لأمر بيع مؤكّد في أودو)")) return;
        $("#confirm").disabled=true; $("#confirm").textContent="جارٍ…";
        api("/orders/"+id+"/confirm",{method:"POST"}).then(function(){ toast("تم تأكيد الطلب"); screenOrder(id); })
          .catch(function(e){ toast("تعذّر: "+e.message); $("#confirm").disabled=false; });
      };
      if($("#del")) $("#del").onclick=function(){
        if(!confirm("حذف المسودّة "+o.name+" نهائيًا؟")) return;
        api("/orders/"+id,{method:"DELETE"}).then(function(){ toast("حُذفت المسودّة"); screenOrders(); })
          .catch(function(e){ toast("تعذّر: "+e.message); });
      };
    }).catch(function(e){ $("#odWrap").innerHTML='<div class="empty">تعذّر الجلب: '+esc(e.message)+'</div>'; });
  }

  // ---------- ورقة لينك الدفع ----------
  // تحويل رقم محلي (05..) إلى صيغة واتساب دولية بلا + ولا صفر بادئ (السعودية 966)
  function waPhone(raw){
    var d=String(raw||"").replace(/\D/g,"");
    if(d.indexOf("00")===0) d=d.slice(2);
    if(d.indexOf("0")===0) d="966"+d.slice(1);
    else if(d && d.indexOf("966")!==0 && d.length<=9) d="966"+d;
    return d;
  }
  function copyText(txt,okMsg){
    function fb(){ var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");toast(okMsg);}catch(e){toast("انسخ يدويًا");} ta.remove(); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},fb); }
    else fb();
  }
  function openPayLink(o){
    var ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML='<div class="sheet"><div class="row"><b>لينك الدفع / المعاينة</b>'
      +'<button class="back" id="x">×</button></div><div id="plBody"><div class="spin"></div></div></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    $("#x",ov).onclick=function(){ ov.remove(); };
    api("/orders/"+o.id+"/payment-link").then(function(d){
      var msg="طلبكم من بيت العباءة الشرقية "+d.name+"\nالإجمالي: "+money(d.amount_total)+"\nلمراجعة الطلب والدفع:\n"+d.url;
      $("#plBody",ov).innerHTML=
        '<div class="muted" style="margin-bottom:8px">نفس رابط زرار «المعاينة» — يفتح بوّابة العميل للمراجعة والدفع (Sign & Pay).</div>'
        +'<div class="linkbox" id="lnk">'+esc(d.url)+'</div>'
        +'<div class="fld"><div class="lbl">جوال العميل (من بياناته)</div><input id="phone" value="'+esc(d.phone||"")+'" placeholder="05xxxxxxxx"></div>'
        +'<div class="grid2"><button class="btn ghost" id="copy">📋 نسخ الرابط</button>'
        +'<button class="btn primary" id="wa">📩 إرسال واتساب</button></div>'
        +'<button class="btn ghost" id="copymsg" style="margin-top:8px">📋 نسخ الرسالة كاملة</button>'
        +(d.phone?'':'<div class="muted" style="margin-top:8px;color:var(--warn)">لا يوجد جوال محفوظ لهذا العميل — أدخله يدويًا.</div>');
      $("#copy",ov).onclick=function(){ copyText(d.url,"نُسخ الرابط"); };
      $("#copymsg",ov).onclick=function(){ copyText(msg,"نُسخت الرسالة"); };
      // فتح واتساب مباشرةً عند الضغط (إيماءة مستخدم) — لا يُحجب كالنوافذ المتأخّرة
      $("#wa",ov).onclick=function(){
        var ph=waPhone($("#phone",ov).value);
        if(!ph){ toast("أدخل جوال العميل أولًا"); return; }
        window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(msg),"_blank");
      };
    }).catch(function(e){ $("#plBody",ov).innerHTML='<div class="empty">تعذّر: '+esc(e.message)+'</div>'; });
  }

  // ================= شاشة: طلب خارجي جديد =================
  function screenNew(){
    view={name:"new"}; setNav("new");
    main.innerHTML=
      '<div class="title">طلب خارجي جديد</div>'
      +'<div class="card"><div class="lbl">العميل</div>'
        +'<div id="custBox"></div></div>'
      +'<div class="card"><div class="row" style="margin-bottom:8px"><b>المنتجات</b>'
        +'<button class="btn ghost sm" id="addProd">+ إضافة منتج</button></div>'
        +'<div id="cartBox"></div></div>'
      +'<div class="card"><div class="lbl">ملاحظة (اختياري)</div><textarea id="note" rows="2">'+esc(note)+'</textarea></div>'
      +'<div class="card"><div class="row" style="font-weight:900;font-size:16px"><span>الإجمالي التقديري</span><span id="cartTotal">'+money(0)+'</span></div>'
        +'<div class="muted" style="margin-top:4px">الضريبة تُحتسب في أودو عند الإنشاء.</div></div>'
      +'<button class="btn primary" id="createOrder">إنشاء عرض السعر في أودو</button>';
    $("#note").oninput=function(){ note=this.value; };
    renderCust(); renderCart();
    $("#addProd").onclick=openProductPicker;
    $("#createOrder").onclick=doCreateOrder;
  }
  function renderCust(){
    var box=$("#custBox"); if(!box) return;
    if(customer){
      box.innerHTML='<div class="row"><div><b>'+esc(customer.name)+'</b>'
        +'<div class="muted">'+esc(customer.phone||"")+'</div></div>'
        +'<button class="btn ghost sm" id="chCust">تغيير</button></div>';
      $("#chCust").onclick=openCustomerPicker;
    } else {
      box.innerHTML='<button class="btn ghost" id="pickCust">اختر العميل أو أضف جديدًا</button>';
      $("#pickCust").onclick=openCustomerPicker;
    }
  }
  function cartTotal(){ return cart.reduce(function(s,l){return s+l.price*l.qty;},0); }
  function renderCart(){
    var box=$("#cartBox"); if(!box) return;
    if(!cart.length){ box.innerHTML='<div class="muted">لا منتجات بعد.</div>'; if($("#cartTotal"))$("#cartTotal").textContent=money(0); return; }
    box.innerHTML=cart.map(function(l,i){
      return '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">'
        +thumbHtml(l.product_id)+'<div style="flex:1"><div style="font-weight:700;font-size:13px">'+esc(l.name)+'</div>'
        +'<div class="muted">'+money(l.price)+(l.code?' · '+esc(l.code):'')+'</div></div>'
        +'<div class="qtybox"><button data-dec="'+i+'">−</button><b style="min-width:20px;text-align:center">'+l.qty+'</b>'
        +'<button data-inc="'+i+'">+</button><button data-rm="'+i+'" style="color:var(--bad)">🗑</button></div></div>';
    }).join("");
    wireThumbs(box);
    if($("#cartTotal"))$("#cartTotal").textContent=money(cartTotal());
    box.querySelectorAll("[data-inc]").forEach(function(b){b.onclick=function(){cart[+b.getAttribute("data-inc")].qty++;renderCart();};});
    box.querySelectorAll("[data-dec]").forEach(function(b){b.onclick=function(){var i=+b.getAttribute("data-dec");cart[i].qty=Math.max(1,cart[i].qty-1);renderCart();};});
    box.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){cart.splice(+b.getAttribute("data-rm"),1);renderCart();};});
  }
  function doCreateOrder(){
    if(!customer){ toast("اختر العميل أولًا"); return; }
    if(!cart.length){ toast("أضف منتجًا واحدًا على الأقل"); return; }
    var btn=$("#createOrder"); btn.disabled=true; btn.textContent="جارٍ الإنشاء…";
    api("/orders",{method:"POST",body:{partner_id:customer.id,note:note,
      lines:cart.map(function(l){return {product_id:l.product_id,qty:l.qty,price_unit:l.price};})}})
      .then(function(d){ toast("أُنشئ عرض السعر"); cart=[];customer=null;note=""; screenOrder(d.id); })
      .catch(function(e){ toast("تعذّر: "+e.message); btn.disabled=false; btn.textContent="إنشاء عرض السعر في أودو"; });
  }

  // ---------- منتقي العملاء ----------
  function openCustomerPicker(){
    var ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML='<div class="sheet"><div class="row"><b>اختر العميل</b><button class="back" id="x">×</button></div>'
      +'<div class="fld" style="margin-top:8px"><input id="cq" placeholder="ابحث بالاسم أو الجوال"></div>'
      +'<button class="btn ghost sm" id="newCust" style="margin-bottom:10px">+ عميل جديد</button>'
      +'<div id="cres"><div class="spin"></div></div></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    $("#x",ov).onclick=function(){ov.remove();};
    var t;
    function load(q){ api("/customers?q="+encodeURIComponent(q||"")).then(function(rows){
      $("#cres",ov).innerHTML = rows.length ? '<div class="card" style="padding:0">'+rows.map(function(c){
        return '<div class="list-item" data-c=\''+esc(JSON.stringify({id:c.id,name:c.name,phone:c.phone}))+'\'>'
          +'<div style="flex:1"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.phone||"")+(c.city?" · "+esc(c.city):"")+'</div></div></div>';
      }).join("")+'</div>' : '<div class="empty">لا نتائج</div>';
      $("#cres",ov).querySelectorAll("[data-c]").forEach(function(el){ el.onclick=function(){
        customer=JSON.parse(el.getAttribute("data-c")); ov.remove(); renderCust(); }; });
    }).catch(function(e){ $("#cres",ov).innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }); }
    $("#cq",ov).oninput=function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){load(v);},300); };
    $("#newCust",ov).onclick=function(){ ov.remove(); openNewCustomer(); };
    load("");
  }
  function openNewCustomer(){
    var ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML='<div class="sheet"><div class="row"><b>عميل جديد</b><button class="back" id="x">×</button></div>'
      +'<div class="fld" style="margin-top:8px"><div class="lbl">الاسم *</div><input id="n"></div>'
      +'<div class="fld"><div class="lbl">الجوال</div><input id="p" placeholder="05xxxxxxxx"></div>'
      +'<div class="fld"><div class="lbl">البريد</div><input id="e"></div>'
      +'<div class="fld"><div class="lbl">المدينة</div><input id="ci"></div>'
      +'<button class="btn primary" id="save">حفظ العميل</button></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    $("#x",ov).onclick=function(){ov.remove();};
    $("#save",ov).onclick=function(){
      var name=$("#n",ov).value.trim(); if(!name){toast("الاسم مطلوب");return;}
      $("#save",ov).disabled=true;
      api("/customers",{method:"POST",body:{name:name,phone:$("#p",ov).value.trim(),email:$("#e",ov).value.trim(),city:$("#ci",ov).value.trim()}})
        .then(function(d){ customer={id:d.id,name:d.name,phone:$("#p",ov).value.trim()}; ov.remove(); renderCust(); toast("أُضيف العميل"); })
        .catch(function(e){ toast("تعذّر: "+e.message); $("#save",ov).disabled=false; });
    };
  }

  // ---------- منتقي المنتجات ----------
  function openProductPicker(){
    var ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML='<div class="sheet"><div class="row"><b>إضافة منتج</b><button class="back" id="x">×</button></div>'
      +'<div class="fld" style="margin-top:8px"><input id="pq" placeholder="ابحث بالاسم أو الكود أو الباركود"></div>'
      +'<div id="pres"><div class="spin"></div></div></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    $("#x",ov).onclick=function(){ov.remove();};
    var t;
    function load(q){ api("/products?q="+encodeURIComponent(q||"")+"&limit=40").then(function(rows){
      $("#pres",ov).innerHTML = rows.length ? '<div class="card" style="padding:0">'+rows.map(function(p){
        return '<div class="list-item" data-p=\''+esc(JSON.stringify({product_id:p.id,name:p.name,code:p.code,price:p.price}))+'\'>'
          +thumbHtml(p.id)+'<div style="flex:1"><div style="font-weight:700;font-size:13px">'+esc(p.name)+'</div>'
          +'<div class="muted">'+(p.code?esc(p.code)+" · ":"")+money(p.price)+'</div></div>'
          +'<button class="btn primary sm" data-add>إضافة</button></div>';
      }).join("")+'</div>' : '<div class="empty">لا نتائج</div>';
      wireThumbs($("#pres",ov));
      $("#pres",ov).querySelectorAll("[data-p]").forEach(function(el){
        el.querySelector("[data-add]").onclick=function(ev){ ev.stopPropagation();
          var p=JSON.parse(el.getAttribute("data-p"));
          var ex=cart.filter(function(c){return c.product_id===p.product_id;})[0];
          if(ex){ ex.qty++; } else { cart.push({product_id:p.product_id,name:p.name,code:p.code,price:p.price,qty:1}); }
          toast("أُضيف: "+p.name); renderCart();
        };
      });
    }).catch(function(e){ $("#pres",ov).innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }); }
    $("#pq",ov).oninput=function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){load(v);},300); };
    load("");
  }

  // ================= شاشة: المنتجات (تصفّح) =================
  function screenProducts(){
    view={name:"products"}; setNav("products");
    main.innerHTML='<div class="title">المنتجات (أودو)</div>'
      +'<div class="fld"><input id="pq" placeholder="ابحث بالاسم أو الكود أو الباركود"></div><div id="pwrap"><div class="spin"></div></div>';
    var t;
    function load(q){ api("/products?q="+encodeURIComponent(q||"")+"&limit=50").then(function(rows){
      $("#pwrap").innerHTML = rows.length ? '<div class="card" style="padding:0">'+rows.map(function(p){
        return '<div class="list-item" style="cursor:default">'+thumbHtml(p.id)+'<div style="flex:1"><div style="font-weight:700;font-size:13px">'+esc(p.name)+'</div>'
          +'<div class="muted">'+(p.code?esc(p.code)+" · ":"")+'متاح: '+(p.qty||0)+'</div></div>'
          +'<b>'+money(p.price)+'</b></div>';
      }).join("")+'</div>' : '<div class="empty">لا نتائج</div>';
      wireThumbs($("#pwrap"));
    }).catch(function(e){ $("#pwrap").innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }); }
    $("#pq").oninput=function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){load(v);},300); };
    load("");
  }

  // ---------- التنقّل ----------
  document.querySelectorAll("nav button").forEach(function(b){
    b.onclick=function(){ var n=b.getAttribute("data-nav");
      if(n==="orders") screenOrders(); else if(n==="new") screenNew(); else if(n==="products") screenProducts(); };
  });

  checkConn();
  screenOrders();
})();
</script>
</body>
</html>
