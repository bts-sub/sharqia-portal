# إعداد nginx داخل حاوية المبيعات — يخدم الملفات الثابتة فقط.
# توجيه /api/* إلى باك-إند البوابة يتولّاه Nginx الأمامي على المضيف (لا هنا).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip            on;
    gzip_types      text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # نسخة العرض (الديمو الأصلي) على /demo
    location = /demo      { try_files /demo.html =404; }
    location = /demo.html { }

    # التطبيق الحقيقي (طلبات/منتجات/لينك دفع) — صفحة واحدة
    location / {
        try_files $uri /index.html;
    }
}
