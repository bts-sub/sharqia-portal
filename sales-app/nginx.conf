# إعداد nginx داخل حاوية المبيعات — يخدم ملف index.html واحد (تطبيق React مضمّن)
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # الحزمة كبيرة (~550KB) — الضغط يقلّلها كثيرًا على الموبايل
    gzip            on;
    gzip_types      text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # نقطة فحص صحّة خفيفة للحاوية ولـ Nginx الأمامي
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # تطبيق صفحة واحدة: أي مسار يرجع نفس الصفحة
    location / {
        try_files $uri /index.html;
    }
}
