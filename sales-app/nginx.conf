# إعداد nginx داخل حاوية المبيعات — يخدم الملفات الثابتة فقط.
# توجيه /api/* إلى باك-إند البوابة يتولّاه Nginx الأمامي على المضيف (لا هنا).
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip            on;
    gzip_types      text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # نسخة العرض (الديمو الأصلي) على /demo
    location = /demo      { try_files /demo.html =404; }
    location = /demo.html { }

    # تطبيق قابل للتثبيت (PWA): عامل الخدمة من الجذر ليتحكّم في كل التطبيق، ولا يُخزَّن في كاش
    # المتصفح (وإلا تأخّرت التحديثات).
    location = /sw.js {
        alias /usr/share/nginx/html/static/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /static/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    # الأيقونات والشعار
    location /static/ {
        add_header Cache-Control "public, max-age=604800";
    }
    # الصفحة نفسها: تُطلب من جديد كل مرة (التحديث يصل فورًا؛ وعامل الخدمة يغطّي انقطاع النت)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # التطبيق الحقيقي (طلبات/منتجات/لينك دفع) — صفحة واحدة
    location / {
        try_files $uri /index.html;
    }
}
