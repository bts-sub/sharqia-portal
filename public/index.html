<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1B1B1B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بوابة الموظفين">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>بيت العباءة الشرقية — بوابة الموظفين</title>
<style>
  *{box-sizing:border-box;} html,body{margin:0;padding:0;background:#FAFAFA;}
  body{font-family:"Tajawal","IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI","Tahoma",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  #root{min-height:100vh;} div::-webkit-scrollbar{display:none;}
  input,textarea,select,button{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-thumb{background:#cbd3dd;border-radius:9px;}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#141414;color:#fff;z-index:2147483000;text-align:center;}
  #loader .dot{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:#C9A227;display:grid;place-items:center;font-size:26px;}
  #loader .lg{width:96px;height:96px;margin:0 auto 16px;border-radius:26px;display:block;object-fit:cover;background:#0D0D0D;box-shadow:0 10px 30px rgba(0,0,0,.45);}
  #loader .bar{width:132px;height:3px;margin:16px auto 0;border-radius:99px;background:#ffffff1f;overflow:hidden;}
  #loader .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#C9A227;animation:sqld 1.1s ease-in-out infinite;}
  @keyframes sqld{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  #loader.gone{opacity:0;pointer-events:none;transition:opacity .35s ease;}
  #loader small{color:#aab6c6;display:block;margin-top:6px;}
</style>

  window.SQ_checkBuild = function () {
    fetch("/api/employee/me", { credentials: "include", cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var live = j && j.appVersion;
        if (!live || !window.SQ_BUILD || live === window.SQ_BUILD) return;
        var key = "sq.reloadedFor." + live;
        try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); } catch (e) {}
        navigator.serviceWorker && navigator.serviceWorker.getRegistration()
          .then(function (r) { if (r) { r.update(); r.waiting && r.waiting.postMessage("SKIP_WAITING"); } })
          .catch(function () {})
          .then(function () { setTimeout(function () { location.reload(); }, 500); });
      }).catch(function () {});
  };
  window.addEventListener("load", function () { setTimeout(window.SQ_checkBuild, 2500); });
  // iOS لا يطلق beforeinstallprompt إطلاقًا — يحتاج شرحًا يدويًا
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.matchMedia("(display-mode: standalone)").matches ||
                   navigator.standalone === true;
  var deferred = null;

  function bar(msg, actionLabel, onAction) {
    if (document.getElementById("sq-install")) return;
    var d = document.createElement("div");
    d.id = "sq-install";
    d.setAttribute("dir", "rtl");
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483000;" +
      "background:#1B1B1B;color:#fff;border-radius:14px;padding:12px 14px;display:flex;" +
      "align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.32);" +
      "font-family:Tajawal,'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:13.5px";
    var icon = document.createElement("img");
    icon.src = "/icons/icon-192.png";
    icon.width = 34; icon.height = 34;
    icon.style.cssText = "border-radius:9px;flex:0 0 auto";
    var txt = document.createElement("div");
    txt.style.cssText = "flex:1;min-width:0;line-height:1.5";
    txt.textContent = msg;
    var act = document.createElement("button");
    act.textContent = actionLabel;
    act.style.cssText = "flex:0 0 auto;background:#C9A227;color:#1B1B1B;border:none;border-radius:9px;" +
      "padding:8px 13px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit";
    act.onclick = onAction;
    var close = document.createElement("button");
    close.textContent = "✕";
    close.setAttribute("aria-label", "إغلاق");
    close.style.cssText = "flex:0 0 auto;background:none;border:none;color:#ffffff9c;font-size:15px;cursor:pointer";
    close.onclick = function () {
      try { localStorage.setItem(DISMISS, String(Date.now())); } catch (e) {}
      d.remove();
    };
    d.appendChild(icon); d.appendChild(txt); d.appendChild(act); d.appendChild(close);
    document.body.appendChild(d);
  }

  function dismissedRecently() {
    try {
      var t = +localStorage.getItem(DISMISS) || 0;
      return Date.now() - t < 14 * 864e5;    // لا نُلحّ: أسبوعان بعد الإغلاق
    } catch (e) { return false; }
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (standalone || dismissedRecently()) return;
    setTimeout(function () {
      bar("ثبّت البوابة على جهازك لتفتحها كتطبيق مستقل.", "تثبيت", function () {
        var el = document.getElementById("sq-install"); if (el) el.remove();
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; });
      });
    }, 2500);
  });

  window.addEventListener("appinstalled", function () {
    var el = document.getElementById("sq-install"); if (el) el.remove();
    try { localStorage.setItem(DISMISS, String(Date.now())); } catch (e) {}
  });

  if (isIOS && !standalone && !dismissedRecently()) {
    setTimeout(function () {
      bar("للتثبيت على الآيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».", "حسنًا", function () {
        try { localStorage.setItem(DISMISS, String(Date.now())); } catch (e) {}
        var el = document.getElementById("sq-install"); if (el) el.remove();
      });
    }, 3500);
  }
})();
</script>
