<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>بيت العباءة الشرقية — بوابة الموظفين</title>
<style>
  *{box-sizing:border-box;} html,body{margin:0;padding:0;background:#F3F5F8;}
  body{font-family:"Tajawal","IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI","Tahoma",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  #root{min-height:100vh;}
  input,textarea,select,button{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;} ::-webkit-scrollbar-thumb{background:#cbd3dd;border-radius:9px;}
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#141414;color:#fff;z-index:99;text-align:center;}
  #loader .dot{width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:#C9A227;display:grid;place-items:center;font-size:26px;}
  #loader small{color:#aab6c6;display:block;margin-top:6px;}
  #err{position:fixed;inset:0;display:none;place-items:center;background:#141414;color:#fff;z-index:100;padding:24px;text-align:center;}
  #err div{max-width:340px;font-size:14px;line-height:1.9;}
</style>
</head>
<body>
<div id="loader"><div><div class="dot">🏢</div><div style="font-weight:800;font-size:18px">بوابة الموظف</div><small>جارٍ التحميل…</small></div></div>
<div id="err"><div>⚠️ تعذّر تحميل ملف <b>app.js</b>.<br/>تأكد أنك فككت ضغط المجلد كاملاً وأن ملف <b>app.js</b> بجانب هذا الملف، ثم افتح <b>employee-portal-demo.html</b> من داخل المجلد.</div></div>
<div id="root"></div>
<script>
  // إظهار رسالة واضحة لو لم يُحمّل السكربت أو حدث خطأ
  function appRendered(){ var r=document.getElementById("root"); return r && r.innerHTML && r.innerHTML.length>150; }
  window.addEventListener("error", function(){ setTimeout(function(){ if(!appRendered()){ var el=document.getElementById("err"); if(el) el.style.display="grid"; } }, 300); });
  setTimeout(function(){ if(!appRendered()){ var el=document.getElementById("err"); if(el) el.style.display="grid"; } }, 4000);
</script>
