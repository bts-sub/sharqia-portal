<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FAFAFA"/>
<title>المهام والجدول — بيت العباءة الشرقية</title>
<link rel="icon" href="/logo-mark.png?v=2"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<script>
  /* ⚠️ السمةُ تُضبَط قبل الرسم لا في schedule.js: لو انتُظرت الوحدةُ لظهرت
     الصفحةُ بلون النظام لحظةً ثمّ انقلبت أمام عين القارئ. والداكنُ في
     التطبيق اختيارٌ في إعداداته، فالصفحةُ الحاضنةُ هي من يُخبر. */
  try {
    var sqT = new URLSearchParams(location.search).get("theme");
    if (sqT === "dark" || sqT === "light")
      document.documentElement.setAttribute("data-theme", sqT);
  } catch (e) { /* تبقى على تفضيل النظام */ }
</script>
<style>
  /* ⚠️ خطٌّ محليٌّ تحت القاهرة: من يفتح جدولَه في المصنع قد لا يصل خطُّ
     جوجل إلى جهازه، فتُقرأ الصفحةُ بخطٍّ عربيٍّ من الخادم لا بخطّ النظام. */
  @font-face { font-family: "PlexAr"; src: url("/fonts/IBMPlexSansArabic-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "PlexAr"; src: url("/fonts/IBMPlexSansArabic-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "PlexAr"; src: url("/fonts/IBMPlexSansArabic-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

  /* ⚠️ الألوانُ والقياساتُ مأخوذةٌ من حزمةِ التطبيق نفسِها لا مقارَبةً:
     الصفحةُ تُعرض داخلَه في إطار، فأيُّ فرقٍ في لونِ الخلفيةِ أو حدِّ
     البطاقةِ يجعلها تبدو موقعًا آخرَ مُدرَجًا فيه. المأخوذُ من كائن
     السمة: bg و surface و surfaceAlt و border و divider و text و
     textSec و textMut و shadow و shadowSm، وعرضُ العمودِ ٤٤٠.
     ⚠️ ولا تُبدَّل هذه بألوان join.html: تلك بوابةٌ خارجَ التطبيق. */
  :root {
    --gold: #C9A227; --gold-2: #D9B94E; --gold-tint: #FBF4DF;
    --ink: #202020; --ink-2: #707070; --mut: #707070; --faint: #9AA0A6;
    --line: #E7E7E7; --line-2: #ECECEC;
    --bg: #FAFAFA; --card: #FFFFFF; --alt: #F5F5F6;
    --ok: #16794A; --ok-bg: #EBF7F0; --bad: #B4232A; --bad-bg: #FBEDED;
    --warn: #8A5A00; --warn-bg: #FBF2DF;
    --sh-1: 0 3px 12px rgba(17,17,17,.05);
    --sh-2: 0 10px 30px rgba(17,17,17,.06);
    --r: 14px;
    --col: 440px;
    --pick-bg: #1B1B1B; --pick-fg: #FFFFFF;
  }
  /* ⚠️ الداكنُ في التطبيق اختيارٌ في إعداداته لا تفضيلُ النظام: فلو تبِعنا
     prefers-color-scheme لخرج الإطارُ داكنًا وما حولَه فاتحًا. فالسمةُ
     تصل سِمةً على <html> من الصفحة الحاضنة (schedule-entry.js)، ولا
     يُسأل النظامُ إلّا إن فُتحت الصفحةُ وحدَها بلا سِمة. */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      --bg: #0E0F12; --card: #17191E; --alt: #1F2228;
      --ink: #ECEDEF; --ink-2: #B3B8C2; --mut: #B3B8C2; --faint: #858C98;
      --line: #2B2F37; --line-2: #252830;
      --gold: #F0CE6E; --gold-2: #F0CE6E; --gold-tint: rgba(240,206,110,.16);
      --ok-bg: #16241D; --bad-bg: #2A1718; --warn-bg: #2A2110;
      --sh-1: 0 3px 12px rgba(0,0,0,.35);
      --sh-2: 0 10px 30px rgba(0,0,0,.45);
      --pick-bg: #F0CE6E; --pick-fg: #17191E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E0F12; --card: #17191E; --alt: #1F2228;
    --ink: #ECEDEF; --ink-2: #B3B8C2; --mut: #B3B8C2; --faint: #858C98;
    --line: #2B2F37; --line-2: #252830;
    --gold: #F0CE6E; --gold-2: #F0CE6E; --gold-tint: rgba(240,206,110,.16);
    --ok-bg: #16241D; --bad-bg: #2A1718; --warn-bg: #2A2110;
    --sh-1: 0 3px 12px rgba(0,0,0,.35);
    --sh-2: 0 10px 30px rgba(0,0,0,.45);
    --pick-bg: #F0CE6E; --pick-fg: #17191E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "PlexAr", "Cairo", system-ui, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  /* عمودُ التطبيق نفسُه: جذرُ الحزمة <div style="max-width:440;margin:0 auto">
     وشريطُ تبويباتها كذلك. ولو اتّسعت الصفحةُ عنه لبرزت خارجَ عمودِه
     فبانت غريبةً عنه ولو تطابقت الألوان. */
  /* ⚠️ فراغٌ أعلى المحتوى: الرأسُ لاصقٌ، فأوّلُ عنصرٍ يقع تحته ويُقصّ
     شريطُ التبويبات. */
  .wrap { max-width: var(--col); margin: 0 auto; padding: 8px 16px 96px; }
  /* مُضمَّنةٌ داخل التطبيق: شريطُ التبويبات خارجَ الإطار، فلا حاجةَ
     إلى فراغٍ تحتَه داخلَه. */
  .sq-embed .wrap { padding-bottom: 24px; }

  /* الرأسُ على قياس رأسِ شاشات التطبيق حرفًا بحرف: سطحٌ أبيضُ لا خلفيةٌ،
     حشوةُ 14/16، فجوةُ 12، حدٌّ أسفلُ واحد، وزرُّ رجوعٍ ٣٦×٣٦ نصفُ قطره
     ١٢ على surfaceAlt، وعنوانٌ ١٧ بثقل ٨٠٠. وهو لاصقٌ عند الصفر: في
     الإطار يقع تحت شريط التطبيق العلويّ مباشرةً، فيُرى كأنّه رأسُ شاشةٍ
     منه لا رأسُ صفحةٍ أخرى. */
  /* ⚠️ الرأسُ بلا صندوقٍ ولا حدّ: كان سطحًا أبيضَ بحدٍّ أسفلَ فبدا
     كأنّ الصفحةَ محبوسةٌ في إطار. فصار على خلفيّة الصفحة نفسِها،
     والخطُّ أصغرَ قليلًا. */
  header { position: sticky; top: 0; z-index: 20; background: var(--bg); }
  .hbar { max-width: var(--col); margin: 0 auto; padding: 10px 16px 6px;
    display: flex; align-items: center; gap: 10px; }
  .hbar h1 { margin: 0; font-size: 15px; font-weight: 800; flex: 1; }
  .back { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--alt); color: var(--ink); font-size: 16px; cursor: pointer;
    display: grid; place-items: center; flex: 0 0 auto; }

  /* ⚠️ شريطُ التبويبات أنحفُ وبلا صندوق: ثلاثةُ تبويباتٍ لا تحتاج
     لوحًا رماديًّا يأخذ من ارتفاع الشاشة. */
  #sq-seg { background: transparent; padding: 0; gap: 4px; }
  #sq-seg button { padding: 6px 4px; font-size: 14px; border-radius: 9px;
    border: 1px solid transparent; }
  #sq-seg button[aria-selected="true"] { border-color: var(--line); }

  .seg { display: flex; gap: 6px; background: var(--line-2); padding: 4px;
    border-radius: 12px; margin: 12px 0 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-weight: 600; padding: 9px 6px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--pick-bg); color: var(--pick-fg); }

  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--sh-1); padding: 14px; margin: 10px 0; }
  .card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .meta { color: var(--mut); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    min-width: 0; }
  .grow { flex: 1; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--gold-tint); color: var(--warn); }
  .pill.late { background: var(--bad-bg); color: var(--bad); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }

  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
  .btn.pri { background: var(--pick-bg); color: var(--pick-fg); border-color: transparent; }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .btn:disabled { opacity: .5; cursor: default; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2);
    margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; }
  textarea { min-height: 76px; resize: vertical; }

  .empty { text-align: center; color: var(--mut); padding: 40px 10px; }
  .err { background: var(--bad-bg); color: var(--bad); border-radius: 10px;
    padding: 10px 12px; margin: 10px 0; font-weight: 600; }
  .sk { height: 74px; border-radius: var(--r); margin: 10px 0;
    background: linear-gradient(90deg, var(--line-2), var(--card), var(--line-2));
    background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  .slot { border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .slot[aria-pressed="true"] { background: var(--pick-bg); color: var(--pick-fg); }


  /* ⚠️ بطاقاتُ المهامّ على قياسٍ واحد: كانت الخطوطُ والمسافاتُ تختلف
     بين بطاقةِ ما عليك وبطاقةِ ما أرسلتَه وبطاقةِ الوارد، فتبدو
     القائمةُ مجموعةَ شاشاتٍ لا قائمةً واحدة. */
  .card h3 { font-size: 15px; line-height: 1.5; }
  .card .meta { font-size: 12.5px; }
  .card .btn { padding: 6px 11px; font-size: 13px; }
  .card .pill, .card .pri { font-size: 11.5px; }

  /* فلاترُ المدى (يوم/أسبوع/من–إلى) بقياس شرائط الحالة نفسِه */
  .seg.sm { background: transparent; padding: 0; gap: 6px; }
  .seg.sm button { padding: 5px 10px; font-size: 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); flex: 0 0 auto; }
  .seg.sm button[aria-selected="true"] { background: var(--pick-bg);
    color: var(--pick-fg); border-color: var(--pick-bg); }
  /* ⚠️ شرائطُ الترشيح صغيرةٌ في سطرٍ واحدٍ يُسحب أفقيًّا: خمسةُ أزرارٍ
     بحجم الأزرار العاديّة تلتفُّ سطرين وتبتلع نصفَ الشاشة قبل أن تُقرأ
     مهمّةٌ واحدة. والشريطُ يُخفي مِسطرتَه فلا يبدو عنصرًا غريبًا. */
  .chips { display: flex; gap: 6px; overflow-x: auto; flex-wrap: nowrap;
    min-width: 0; max-width: 100%;
    margin-top: 6px; padding-bottom: 2px; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .slot { flex: 0 0 auto; padding: 5px 11px; font-size: 13px;
    border-radius: 999px; }

  /* خانةُ بحثٍ أنحف — هي معينةٌ لا عنصرٌ رئيسٌ في الشاشة */
  input[type="search"] { padding: 6px 11px; font-size: 14px; }

  /* ⚠️ ألوانُ الأولويّة تُقرأ من بعيدٍ بلا قراءة: الأحمرُ عاجلٌ
     والبرتقاليُّ مهمٌّ والرماديُّ عاديّ — وهذا ما طلبته الإدارة. */
  .pri { display: inline-flex; align-items: center; font-size: 12px;
    font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .pri0 { background: var(--line-2); color: var(--mut); }
  .pri1 { background: #FBF0E0; color: #9A5B00; }
  .pri2 { background: var(--bad-bg); color: var(--bad); }
  :root[data-theme="dark"] .pri1 { background: #2A2110; color: #E8A33D; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .pri1 { background: #2A2110; color: #E8A33D; }
  }
</style>
</head>
<body>
<!-- ⚠️ شريطُ التبويبات **داخلَ** الرأس اللاصق لا تحته: كان أوّلَ عنصرٍ
     في المحتوى، فيقع تحت الرأس عند بعض أحجام الخطوط ويُقصّ نصفُه.
     وباجتماعهما في عنصرٍ لاصقٍ واحدٍ لا يُقصّ أبدًا. -->
<header>
  <div class="hbar">
    <button class="back" id="sq-back" aria-label="رجوع">›</button>
    <h1>المهام والجدول</h1>
  </div>
  <div class="hbar" style="padding-top:0;padding-bottom:10px">
    <div class="seg" role="tablist" id="sq-seg" style="flex:1;margin:0"></div>
  </div>
</header>
<div class="wrap">
  <div id="sq-body"></div>
</div>
<script src="/schedule.js?v=13" type="module"></script>
</body>
</html>
