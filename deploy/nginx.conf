# =====================================================================
#  نموذج Nginx لنشر البوابة على subdomain مع SSL
#  ضعه في /etc/nginx/sites-available/portal ثم فعّله بـ symlink، وأضف SSL بـ certbot.
#  البوابة تستمع محليًا على 4000؛ تطبيقك الآخر على 3001 (منفصل تمامًا).
# =====================================================================

server {
    listen 80;
    server_name hr.mohamed-elnoby.com;      # ← غيّر إلى الـ subdomain الحقيقي
    # إعادة التوجيه إلى HTTPS (بعد إصدار الشهادة)
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name hr.mohamed-elnoby.com;      # ← غيّر إلى الـ subdomain الحقيقي

    # شهادات certbot (تُملأ تلقائيًا عند: sudo certbot --nginx -d hr.mohamed-elnoby.com)
    ssl_certificate     /etc/letsencrypt/live/hr.mohamed-elnoby.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.mohamed-elnoby.com/privkey.pem;

    client_max_body_size 15m;           # يسمح برفع المرفقات

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
